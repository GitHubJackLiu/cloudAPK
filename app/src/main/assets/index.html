<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>硬件自检 Bridge 版</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#181818; color:#fff; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .hint { color:#aaa; font-size:13px; margin-bottom:18px; line-height:1.5; }
  .btn { display:block; width:100%; padding:15px; margin-bottom:12px; font-size:16px;
         border:0; border-radius:10px; background:#e0e0e0; color:#111; cursor:pointer; }
  .btn:active { background:#bcbcbc; }
  #status { font-size:16px; line-height:1.6; margin:16px 0; padding:12px;
            background:#232323; border-radius:8px; min-height:48px; }
  #cam { display:none; width:100%; height:260px; margin-top:12px;
         background:#2a2a2a; border-radius:10px; }
  .tag { font-size:12px; color:#777; margin-top:20px; }
</style>
</head>
<body>
  <h1>硬件自检 · Bridge 版</h1>
  <div class="hint">界面是 HTML（可浏览器实时预览）<br>硬件功能走 JS Bridge 调原生</div>

  <button class="btn" onclick="Native.testSpeaker()">① 测喇叭（1kHz 蜂鸣 2 秒）</button>
  <button class="btn" onclick="Native.testMic()">② 测麦克风（录 3 秒 → 回放）</button>
  <button class="btn" onclick="Native.toggleCamera()">③ 测摄像头（开/关预览）</button>

  <div id="status">点按钮开始（首次会弹权限，选允许）</div>
  <div id="cam"></div>
  <div class="tag">包名 com.example.hwbridge · 与上版可共存</div>

<script>
  // 原生通过这个回调把状态写回页面
  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }
  function showCam(on) {
    document.getElementById('cam').style.display = on ? 'block' : 'none';
  }
</script>
</body>
</html>
