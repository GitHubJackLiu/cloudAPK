<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>小度 · 语音终端</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 触摸设备不需要焦点框：input tap / 手指点击后会留一圈橙色 outline，很像 bug */
  button{outline:0}
  button:focus,button:active{outline:0}
  html,body{margin:0;height:100%;background:#0b0e14;color:#e6e9ef;
    font-family:-apple-system,"Noto Sans SC",sans-serif;overflow:hidden}
  .wrap{height:100%;position:relative;overflow:hidden}

  /* ---------- 悬浮图标：不再占一整条状态栏 ---------- */
  .hud{position:absolute;z-index:20;display:flex;align-items:center;gap:8px;
    border-radius:14px;background:rgba(18,22,31,.88)}
  .hud-tl{top:14px;left:16px;padding:7px 13px 7px 11px;
    border:1px solid rgba(45,54,72,.85)}
  .hud-tr{top:14px;right:16px;width:46px;height:46px;justify-content:center;
    border:1px solid rgba(45,54,72,.85);color:#c9d2e3;font-size:20px;padding:0}
  .hud-tr:active{background:rgba(30,58,43,.9)}
  .dot{width:8px;height:8px;border-radius:50%;background:#4c5567;flex:0 0 auto;
    transition:background .25s,box-shadow .25s}
  .dot.on{background:#5ad48b;box-shadow:0 0 9px rgba(90,212,139,.85)}
  .dot.err{background:#f06d6d;box-shadow:0 0 9px rgba(240,109,109,.7)}
  .dot.busy{background:#f2c14e;box-shadow:0 0 9px rgba(242,193,78,.7);
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .hud-tl span{font-size:12px;color:#9aa3b5;letter-spacing:.2px;white-space:nowrap}

  /* ---------- 舞台 ---------- */
  /* 视口 973x600 横屏，高度只有 561 CSS px。
     上一版为了给对话区留固定比例，把脸压到了 224px。现在改成：
     脸绝对居中、尺寸只受高度约束；对话气泡变左上浮层，不再挤占脸的版面。 */
  .stage{position:absolute;top:0;right:0;bottom:0;left:0;display:block;overflow:hidden}

  /* 设置页/网络页装在常驻 iframe 里，不再整页跳转。
     整页跳转要重新解析 305KB 的 lottie.min.js 并重建整套 DOM，
     在 1GB 的机器上一次进出就是半秒起步的白屏。 */
  #shell{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;
    border:0;background:#0b0e14;z-index:40;display:none}
  #shell.on{display:block}

  .talk{position:absolute;left:20px;top:58px;width:min(304px,32vw);max-height:47%;
    overflow-y:auto;overflow-x:hidden;padding:2px 2px 4px;z-index:6;
    display:flex;flex-direction:column;gap:9px;justify-content:flex-end;
    scrollbar-width:none}
  .talk::-webkit-scrollbar{display:none}

  .hero{position:absolute;top:0;right:0;bottom:0;left:0;
    display:flex;align-items:center;justify-content:center}
  /* 72vh ≈ 404px，是上一版 224px 的 1.8 倍；46vw 兜住窄屏 */
  .avatar{width:min(440px,72vh,46vw);height:min(440px,72vh,46vw);border-radius:50%;
    position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 34%,#2b3d63,#141d30 72%);
    box-shadow:0 0 0 1px #2c3a56,0 18px 52px rgba(0,0,0,.62);
    transition:box-shadow .3s}
  #lottieBox{width:100%;height:100%}
  #lottieBox svg,#lottieBox canvas{width:100%!important;height:100%!important;display:block}
  .avatar::after{content:"";position:absolute;top:-13px;right:-13px;bottom:-13px;left:-13px;border-radius:50%;
    border:3px solid rgba(90,212,139,.5);opacity:0;pointer-events:none;
    will-change:transform,opacity}
  .stage.speaking .avatar::after{animation:halo 2s ease-out infinite}
  .stage.speaking .avatar{box-shadow:0 0 0 1px #3c6a58,0 18px 52px rgba(0,0,0,.62),
               0 0 46px rgba(90,212,139,.26)}
  @keyframes halo{0%{transform:scale(.97);opacity:.5}100%{transform:scale(1.07);opacity:0}}

  /* 按钮改为右下角悬浮：不再占竖直空间，脸才可能长到 404px */
  .callwrap{position:absolute;right:46px;bottom:54px;z-index:7;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .round{width:72px;height:72px;border-radius:50%;border:0;padding:0;
    background:#5ad48b;color:#0b0e14;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 26px rgba(90,212,139,.26);
    transition:background .22s,box-shadow .22s,transform .12s}
  .round:active{transform:scale(.94)}
  .round svg{width:30px;height:30px;fill:currentColor;display:block;overflow:visible}
  .round.stop{background:#f06d6d;box-shadow:0 8px 26px rgba(240,109,109,.28)}
  .round.busy{background:#2a3344;color:#f2c14e;
    box-shadow:0 0 0 3px rgba(242,193,78,.16) inset}
  .round.busy svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .calllabel{font-size:12px;color:#7d879c;letter-spacing:.3px;height:15px}

  /* ---------- 左下角状态浮层（原「通道就绪 / 电平条」搬到这里） ---------- */
  .hud-bl{left:16px;bottom:14px;flex-direction:column;align-items:stretch;gap:6px;
    padding:9px 13px;min-width:168px;max-width:40%;
    border:1px solid rgba(45,54,72,.7);transition:opacity .25s}
  .hud-bl.hide{opacity:0;pointer-events:none}
  .hud-bl .note{font-size:11.5px;color:#8d96aa;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lvl{height:4px;border-radius:2px;background:rgba(38,46,64,.9);overflow:hidden}
  .lvl i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#3fa96b,#5ad48b);transition:width .09s linear}

  /* ---------- 气泡：去掉三角，用不对称圆角表达方向 ---------- */
  .msg{max-width:100%;padding:10px 14px;font-size:15px;line-height:1.5;
    word-break:break-word;box-shadow:0 4px 14px rgba(0,0,0,.34);
    animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.ai{background:rgba(31,42,61,.94);color:#e6e9ef;align-self:flex-start;
    border-radius:18px 18px 18px 6px}
  .msg.me{background:rgba(35,92,61,.94);color:#eaf7ef;align-self:flex-end;
    border-radius:18px 18px 6px 18px}
  .msg.sys{background:rgba(18,22,31,.7);color:#7d879c;font-size:12px;
    align-self:center;padding:5px 12px;border-radius:11px;
    text-align:center;box-shadow:none}

  /* 未绑定时的验证码面板 */
  #act{position:fixed;top:0;right:0;bottom:0;left:0;z-index:120;display:none;padding:26px;
    background:rgba(8,11,17,.95);align-items:center;justify-content:center}
  #act.show{display:flex}
  .actcard{width:100%;max-width:460px;text-align:center}
  .actbrand{font-size:12px;letter-spacing:.2em;color:#6b7690;text-transform:uppercase}
  .actttl{margin-top:10px;font-size:17px;font-weight:600;color:#e6e9ef}
  .actcode{margin:20px 0 6px;font-family:ui-monospace,Menlo,monospace;font-size:62px;
    font-weight:700;letter-spacing:.2em;color:#5ad48b;line-height:1.1;
    text-shadow:0 0 26px rgba(90,212,139,.35)}
  .actrule{height:1px;background:#1d2331;margin:18px 0}
  .acthint{font-size:13px;color:#aab2c4;line-height:1.8}
  .acthint b{color:#8fb6ff;font-weight:600}
  .actwait{margin-top:18px;font-size:12px;color:#6b7690;
    display:flex;align-items:center;justify-content:center;gap:7px}
  .spin{width:11px;height:11px;border:2px solid #2a3344;border-top-color:#5ad48b;
    border-radius:50%;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* AEC 通路实验面板（调试用，长按齿轮打开） */
  #aec{position:fixed;top:0;right:0;bottom:0;left:0;z-index:150;display:none;flex-direction:column;
    background:#0b0e14;padding:12px 14px}
  #aec.show{display:flex}
  .aectop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .aectop h2{flex:1;margin:0;font-size:16px;font-weight:600}
  .abtn{height:44px;padding:0 16px;border-radius:11px;border:1px solid #33507e;
    background:#1b2a45;color:#8fb6ff;font-size:14px;font-weight:600}
  .aresult{margin-bottom:8px;padding:9px 12px;border-radius:10px;
    background:#12161f;border:1px solid #1d2331;font-size:12px;
    font-family:ui-monospace,Menlo,monospace;color:#9aa3b5;line-height:1.7}
  .aresult b{color:#e6e9ef}
  .aresult.good{border-color:#3fa96b;color:#8fe0b0}
  .aresult.bad{border-color:#8a3b3b;color:#f0a0a0}
</style>
</head>
<body>
<div class="wrap">
  <iframe id="shell" title="设置"></iframe>
  <div class="hud hud-tl">
    <div class="dot" id="dot"></div>
    <span id="chipMode">待连接</span>
  </div>
  <button class="hud hud-tr" id="gear" aria-label="设置">⚙</button>

  <div class="stage" id="stage">
    <div class="talk" id="talk"></div>
    <div class="hero">
      <div class="avatar"><div id="lottieBox"></div></div>
      <div class="callwrap">
        <button class="round" id="btn" aria-label="开始通话">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.1 21 3 13.9 3 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.6 3.6a1 1 0 0 1-.2 1.1l-2.3 2.1z"/></svg>
        </button>
        <div class="calllabel" id="callLabel">点击开始通话</div>
      </div>
    </div>
  </div>

  <div class="hud hud-bl" id="statusBox">
    <div class="note" id="note">待连接</div>
    <div class="lvl"><i id="lvl"></i></div>
  </div>
</div>

<div id="act">
  <div class="actcard">
    <div class="actbrand">Xiaozhi</div>
    <div class="actttl">这台设备还没有绑定</div>
    <div class="actcode" id="actCode">------</div>
    <div class="actrule"></div>
    <div class="acthint">
      打开 <b>xiaozhi.me</b> 控制台 → 添加设备 → 输入上面这 6 位数字<br>
      绑定成功后会自动连上，不用做别的
    </div>
    <div class="actwait"><span class="spin"></span><span id="actSub">等待绑定…</span></div>
  </div>
</div>

<div id="aec">
  <div class="aectop">
    <h2>AEC 通路实验</h2>
    <button class="abtn" id="aecRun">跑矩阵</button>
    <button class="abtn" id="aecAb">跑 A/B</button>
    <button class="abtn" id="aecClose">关闭</button>
  </div>
  <div class="note" style="margin-bottom:8px;color:#8d96aa;font-size:12px">
    验证原生 VOICE_COMMUNICATION 能否启用 MTK DSP 的硬件 AEC。<br>
    <b>矩阵</b>：ERLE = 有测试音时的 1kHz 分量 − 静默本底（组内自比，消掉增益差异）。<br>
    <b>A/B</b>：同一通路下切 HAL 的 aec_mode 开关，ERLE = 关时残余 − 开时残余。&lt;5dB 视为无效。
  </div>
  <div id="aecOut" style="flex:1;overflow:auto"></div>
</div>


<script src="lottie.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var dot = $('dot'), chipMode = $('chipMode'), talk = $('talk'), lvl = $('lvl'),
      btn = $('btn'), gear = $('gear'), stage = $('stage'),
      act = $('act'), actCode = $('actCode'), actSub = $('actSub'),
      noteEl = $('note'), statusBox = $('statusBox'), callLabel = $('callLabel'),
      aecPanel = $('aec'), aecOut = $('aecOut');

  // 挂断图标：听筒整体旋转 135°，viewBox 外扩 4px 防止旋转后被裁掉
  var ICON_CALL = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.1 21 3 13.9 3 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.6 3.6a1 1 0 0 1-.2 1.1l-2.3 2.1z"/></svg>';
  var ICON_HANGUP = '<svg viewBox="-4 -4 32 32"><g transform="rotate(135 12 12)"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.1 21 3 13.9 3 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.6 3.6a1 1 0 0 1-.2 1.1l-2.3 2.1z"/></g></svg>';
  var ICON_SPIN = '<svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 8.8 8.8h-2.6A6.2 6.2 0 1 1 12 5.8V3.2z"/></svg>';

  var S = null;
  /**
   * 会话状态唯一真源：idle / connecting / live。
   * 以前用布尔 running 在网页里自己翻，原生侧失败或主动断开时
   * 网页不知道，按钮就卡在红色挂断态点不动。
   */
  var st = 'idle';
  var liveTimer = null;

  // --------------- 表情渲染开销 ----------------
  // canvas 渲染 + medium 采样：这台机器是 MT8167 + 1GB RAM，
  // 高质量 canvas 每帧要重采样一遍 404px 的位图，反而比 svg 更慢。
  try { lottie.setQuality('medium'); } catch(e){}

  // ---------------- 情绪表情 ----------------
  var EMOTIONS = ['neutral','happy','laughing','funny','sad','angry','crying',
    'loving','embarrassed','surprised','shocked','thinking','winking','cool',
    'relaxed','delicious','kissy','confident','sleepy','silly','confused'];
  var EMOJI2EMO = {
    '1f636':'neutral','1f642':'happy','1f60a':'happy','1f606':'laughing',
    '1f602':'funny','1f614':'sad','1f620':'angry','1f62d':'crying',
    '1f60d':'loving','1f633':'embarrassed','1f62f':'surprised','1f631':'shocked',
    '1f914':'thinking','1f609':'winking','1f60e':'cool','1f60c':'relaxed',
    '1f924':'delicious','1f618':'kissy','1f60f':'confident','1f634':'sleepy',
    '1f61c':'silly','1f644':'confused'
  };
  var emoAnim = null, emoNow = '', emoLoad = 0, emoTimer = null;
  function emojiOf(text){
    if (!text) return '';
    var cps = Array.from(text).map(function(c){ return c.codePointAt(0).toString(16); });
    for (var i = 0; i < cps.length; i++){ if (EMOJI2EMO[cps[i]]) return EMOJI2EMO[cps[i]]; }
    return '';
  }
  /**
   * 加载表情 JSON。
   * 页面来自 file:///android_asset/，fetch() 在 file:// 下直接报
   * "URL scheme file is not supported"，必须用 XMLHttpRequest。
   */
  // 表情 JSON 缓存：每次切情绪都重新 XHR 读文件 + JSON.parse，
  // 一份表情数据几十 KB，低端机上这一下就有肉眼可见的顿挫。
  // 22 个表情全缓存也就 1MB 上下，1GB 内存的机器扛得住。
  var emoCache = {};
  function loadJson(url, cb){
    if (emoCache[url]){ cb(emoCache[url]); return; }
    try {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.onload = function(){
        if (x.status === 0 || x.status === 200){
          try {
            var data = JSON.parse(x.responseText);
            emoCache[url] = data;
            cb(data);
          }
          catch(e){ console.log('parse fail ' + url); }
        }
      };
      x.onerror = function(){ console.log('xhr error ' + url); };
      x.send(null);
    } catch(e){ console.log('xhr throw ' + e.message); }
  }

  function setEmotion(name, holdMs){
    name = (EMOTIONS.indexOf(name) >= 0) ? name : 'neutral';
    if (emoTimer){ clearTimeout(emoTimer); emoTimer = null; }
    if (holdMs > 0){ emoTimer = setTimeout(function(){ setEmotion('neutral'); }, holdMs); }
    if (name === emoNow && emoAnim) return;
    emoNow = name;
    var seq = ++emoLoad;
    loadJson('emoji/' + name + '.json', function(data){
      if (seq !== emoLoad) return;
      if (emoAnim) emoAnim.destroy();
      // canvas 比 svg 省得多：svg 每帧要动几十个 path 节点，脸放大到 404px 后
      // 重绘面积翻了 3 倍，MT8167 的 CPU 顶不住，直接用手点都发涩。
      emoAnim = lottie.loadAnimation({
        container: $('lottieBox'), renderer: 'canvas',
        loop: true, autoplay: true, animationData: data,
        rendererSettings: { clearCanvas: true, progressiveLoad: true,
                            hideOnTransparent: true }
      });
      // 容器尺寸是百分比，若首次 load 时布局还没落地，canvas 会按 0×0 建出来
      // 关掉亚帧插值：默认每帧要按时间在关键帧之间插值两次以上，
      // 这台机器上直接省掉约三成渲染耗时，肉眼几乎看不出差别
      try { emoAnim.setSubframe(false); } catch(e){}
      setTimeout(function(){
        try { emoAnim && emoAnim.resize(); } catch(e){}
      }, 60);
    });
  }

  function msg(text, cls){
    var d = document.createElement('div');
    d.className = 'msg ' + (cls || 'sys');
    d.textContent = text;
    talk.appendChild(d);
    talk.scrollTop = talk.scrollHeight;
    while (talk.children.length > 40) talk.removeChild(talk.firstChild);
  }
  function note(text){ noteEl.textContent = text || ''; }
  function setMode(text, cls){
    chipMode.textContent = text;
    dot.className = 'dot' + (cls ? ' ' + cls : '');
  }

  // ---------------- 按钮状态 ----------------
  function paint(){
    if (st === 'live'){
      btn.className = 'round stop';
      btn.innerHTML = ICON_HANGUP;
      btn.disabled = false;
      btn.setAttribute('aria-label', '挂断');
      callLabel.textContent = '通话中 · 点击挂断';
    } else if (st === 'connecting'){
      btn.className = 'round busy';
      btn.innerHTML = ICON_SPIN;
      btn.disabled = true;
      btn.setAttribute('aria-label', '正在连接');
      callLabel.textContent = '正在连接…';
    } else {
      btn.className = 'round';
      btn.innerHTML = ICON_CALL;
      btn.disabled = false;
      btn.setAttribute('aria-label', '开始通话');
      callLabel.textContent = '点击开始通话';
    }
  }
  function setIdle(reason){
    st = 'idle';
    if (liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
    stage.classList.remove('speaking');
    paint();
    setMode(reason || '待连接');
  }

  function applyUI(){
    // 亮度已改由原生窗口亮度控制，这里不再叠遮罩层，
    // 否则会和系统亮度相乘，出现「调一半变四分之一」的双重衰减。
    var sd = !S || !S.ui || S.ui.showDebug !== false;
    statusBox.className = 'hud hud-bl' + (sd ? '' : ' hide');
  }

  setEmotion('neutral');
  paint();

  // ---------------- 与原生通信 ----------------
  var hasNative = (typeof window.Native !== 'undefined');

  function loadSettings(){
    if (hasNative){
      try { return Promise.resolve(JSON.parse(window.Native.getSettings())); }
      catch(e){ return Promise.resolve(null); }
    }
    return Promise.resolve(null);
  }
  function saveSettings(obj){
    if (hasNative){
      try { window.Native.saveSettings(JSON.stringify(obj)); } catch(e){}
    }
    return Promise.resolve({ok:true});
  }
  window.xzSaveSettings = saveSettings;

  loadSettings().then(function(s){
    if (s){ S = s; applyUI(); }
    setMode('待连接');
  });

  // 首次点齿轮才真正加载设置页，避免拖慢冷启动；之后就是 display 切换，瞬时
  var shell = $('shell');
  gear.onclick = function(){
    if (shell.getAttribute('data-loaded') !== '1'){
      shell.src = 'settings.html';
      shell.setAttribute('data-loaded', '1');
    }
    shell.classList.add('on');
  };
  window.closeShell = function(){ shell.classList.remove('on'); };
  window.addEventListener('message', function(e){
    if (e && e.data === 'xz-close-shell') shell.classList.remove('on');
  });

  // ---------------- 原生事件入口 ----------------
  window.onNativeEvent = function(type, payload){
    var p = payload || {};
    switch(type){
      case 'session':
        if (p.state === 'started'){
          st = 'live';
          if (liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
          paint();
          setMode('小智 · 已连接', 'on');
        } else {
          // stopped / failed 都由原生下发，网页不自己猜状态
          if (p.state === 'failed') note('连接失败');
          setIdle(p.state === 'failed' ? '连接失败' : '待连接');
          dot.className = 'dot' + (p.state === 'failed' ? ' err' : '');
        }
        break;
      case 'ready':
        act.classList.remove('show');
        setMode('小智 · 已连接', 'on');
        note('通道就绪 · 下行 ' + ((p.downRate||24000)/1000) + 'kHz');
        break;
      case 'net':
        note(p.text || '');
        setMode('连接中', 'busy');
        break;
      case 'error':
        note(p.text || '出错了');
        setMode('连接异常', 'err');
        break;
      case 'stt':
        if (p.text) msg(p.text, 'me');
        setMode('小智 · 识别中', 'on');
        break;
      case 'llm':
        setEmotion(p.emotion || emojiOf(p.text));
        setMode('小智 · 思考中', 'on');
        break;
      case 'tts':
        if (p.state === 'start'){
          stage.classList.add('speaking');
          setMode('小智 · 说话中', 'on');
        } else if (p.state === 'sentence_start'){
          if (p.text) msg(p.text, 'ai');
        } else if (p.state === 'stop'){
          stage.classList.remove('speaking');
          setMode('小智 · 已连接', 'on');
          setEmotion('neutral');
        }
        break;
      case 'activate':
        if (p.state === 'done'){
          act.classList.remove('show');
          note('设备已绑定 · 正在连接小智');
        } else {
          var c = String(p.code || '');
          actCode.textContent = c.length === 6 ? c.slice(0,3) + ' ' + c.slice(3) : (c || '------');
          actSub.textContent = '等待绑定… 绑定后自动连接';
          act.classList.add('show');
          setMode('待绑定', 'err');
        }
        break;
      case 'goodbye':
        note('小智已挂断');
        setIdle('待连接');
        if (hasNative){ try { window.Native.stop(); } catch(e){} }
        break;
      case 'mode':
        if (S){ S.ui = S.ui || {}; S.ui.mode = p.mode; }
        break;
      case 'permission':
        break;
      case 'aec':
        addAecResult(p);
        break;
      case 'aecMode':
        addAecModeResult(p);
        break;
      case 'aecDone':
        var d2 = document.createElement('div');
        d2.className = 'aresult';
        d2.innerHTML = '<b>矩阵完成</b>';
        aecOut.appendChild(d2);
        break;
    }
  };

  // ---------------- 启动 / 停止 ----------------
  function start(){
    if (st !== 'idle') return;
    st = 'connecting';
    paint();
    setMode('连接中', 'busy');
    note('正在建立连接…');
    if (hasNative){
      try { window.Native.start(); }
      catch(e){ setIdle('启动失败'); note('启动失败：' + e.message); return; }
    }
    // 看门狗：原生迟迟不给 started/failed 时不能让按钮永久卡在转圈
    liveTimer = setTimeout(function(){
      if (st === 'connecting'){
        note('连接超时，请重试');
        setIdle('连接超时');
      }
    }, 30000);
  }
  function stop(){
    if (st === 'idle') return;
    st = 'idle';
    if (liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
    stage.classList.remove('speaking');
    paint();
    setMode('待连接');
    note('已挂断');
    if (hasNative){ try { window.Native.stop(); } catch(e){} }
  }
  btn.onclick = function(){ (st === 'live') ? stop() : start(); };

  // ---------------- AEC 通路实验（调试，长按齿轮） ----------------
  function addAecResult(p){
    var d = document.createElement('div');
    var erle = p.erle;
    var cls = 'aresult';
    if (typeof erle === 'number'){
      if (erle >= 15) cls += ' good';
      else if (erle < 5) cls += ' bad';
    }
    d.className = cls;
    var txt = '<b>' + (p.name||'') + '</b><br>';
    txt += '本底 ' + num(p.floorDb) + ' dBFS · 有声 ' + num(p.toneDb) + ' dBFS';
    if (typeof erle === 'number') txt += ' · <b>ERLE ' + erle.toFixed(1) + ' dB</b>';
    if (p.note) txt += '<br>' + p.note;
    d.innerHTML = txt;
    aecOut.appendChild(d);
    aecOut.scrollTop = aecOut.scrollHeight;
  }
  function num(v){
    if (v === null || v === undefined || isNaN(v)) return '—';
    return Number(v).toFixed(1);
  }
  function addAecModeResult(p){
    var d = document.createElement('div');
    var dB = typeof p.toneDb === 'number' ? p.toneDb : -120;
    var cls = 'aresult';
    if (dB < -70) cls += ' good';
    else if (dB > -60) cls += ' bad';
    d.className = cls;
    var txt = '<b>' + (p.name||'') + '</b><br>';
    txt += 'src=' + p.src + ' use=' + p.usage + ' mode=' + p.mode;
    txt += ' · track先开=' + (p.trackFirst?1:0) + ' · 钉扬声器=' + (p.prefSpeaker?1:0) + '<br>';
    txt += '本底 ' + num(p.floorDb) + ' dBFS · <b>残余回声 ' + num(p.toneDb) + ' dBFS</b>';
    if (p.note) txt += '<br>' + p.note;
    d.innerHTML = txt;
    aecOut.appendChild(d);
    aecOut.scrollTop = aecOut.scrollHeight;
  }
  $('aecAb').onclick = function(){
    aecOut.innerHTML = '';
    if (hasNative){ try { window.Native.runAecMode(); } catch(e){ note('A/B 测试启动失败'); } }
  };
  $('aecRun').onclick = function(){
    aecOut.innerHTML = '';
    if (hasNative){ try { window.Native.runAecMatrix(); } catch(e){ note('AEC 测试启动失败'); } }
  };
  $('aecClose').onclick = function(){ aecPanel.classList.remove('show'); };
  window.showAecPanel = function(){
    aecPanel.classList.add('show');
    aecOut.innerHTML = '';
  };
  window.runAecMatrix = function(){
    aecOut.innerHTML = '';
    if (hasNative){ try { window.Native.runAecMatrix(); } catch(e){} }
  };
  window.runAecMode = function(){
    aecOut.innerHTML = '';
    if (hasNative){ try { window.Native.runAecMode(); } catch(e){} }
  };
  // 长按齿轮 800ms 打开 AEC 面板（双击不再触发，避免和单击进设置打架）
  var gearTimer = null;
  gear.addEventListener('touchstart', function(){
    gearTimer = setTimeout(function(){ aecPanel.classList.add('show'); }, 800);
  }, {passive:true});
  gear.addEventListener('touchend', function(){ clearTimeout(gearTimer); }, {passive:true});
  gear.addEventListener('touchcancel', function(){ clearTimeout(gearTimer); }, {passive:true});

  // ---------------- 电平刷新 ----------------
  // 原来每 200ms 调一次 getAudioPath()，它在原生侧要拼一整段 JSON，
  // 再让 JS 解析一遍；JS→Java 是同步穿越，低端机上一次能卡十几毫秒。
  // 现在改成直接返回 int，且只在通话中轮询。
  setInterval(function(){
    if (!hasNative || st !== 'live') return;
    var v = 0;
    try { v = window.Native.getLevel() | 0; } catch(e){ return; }
    lvl.style.width = (v > 100 ? 100 : v) + '%';
  }, 250);
})();
</script>
