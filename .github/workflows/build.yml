name: Build Kiosk APK

on:
  push:
    branches: [main, master]
    tags: ['v*']          # 打 v 开头的 tag 时额外发 Release
  workflow_dispatch:

permissions:
  contents: write         # 创建 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只有打 tag 才注入版本号并标记本次为 release；
      # 普通 push（含手动触发）保持 1.0 / 1，且不发 Release。
      - name: Resolve version from tag
        id: ver
        run: |
          set -e
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/v}"
            # 约定 tag 格式 v<major>.<minor>，如 v1.2 / v1.10；
            # v1.2 -> versionName 1.2, versionCode 102；v1.10 -> 110
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "!! tag '$TAG' 格式不对，应为 v<数字>.<数字>，如 v1.2"; exit 1
            fi
            MAJOR="${TAG%%.*}"
            MINOR="${TAG#*.}"
            CODE=$((10#$MAJOR * 100 + 10#$MINOR))
            echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
            echo "APP_VERSION_NAME=$TAG" >> "$GITHUB_ENV"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
            echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG -> name=$TAG code=$CODE"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "no version tag, defaults 1.0 / 1"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 注意：不再用 android-actions/setup-android@v3 ——
      # 最新 runner 镜像的 cmdline-tools 已移除 `tools` 包，该 action 内部
      # 执行 `sdkmanager tools` 会直接失败（Failed to find package 'tools'）。
      # ubuntu-latest 自带 Android SDK，直接用 sdkmanager 装缺的组件即可。

      - name: Fetch opus source
        run: |
          # opus 源码不入库（3.6MB / 300+ 文件），构建时现取。
          # 主源 xiph.org，失败则退到 GitHub 镜像。
          set -e
          cd app/src/main/cpp
          URL1="https://downloads.xiph.org/releases/opus/opus-1.3.1.tar.gz"
          URL2="https://github.com/xiph/opus/archive/refs/tags/v1.3.1.tar.gz"
          ok=0
          for u in "$URL1" "$URL2"; do
            echo "== trying $u"
            if curl -fsSL --retry 3 --retry-delay 2 -m 180 -o /tmp/opus.tar.gz "$u"; then
              ok=1; break
            fi
          done
          if [ "$ok" != "1" ]; then echo "!! opus 源码下载失败"; exit 1; fi
          tar xzf /tmp/opus.tar.gz -C /tmp
          # 两种包解出来的目录名不同，统一成 opus-1.3.1
          SRC=$(find /tmp -maxdepth 1 -type d -name "opus-1.3.1*" ! -path "/tmp/opus-1.3.1" | head -1)
          if [ -z "$SRC" ]; then SRC=/tmp/opus-1.3.1; fi
          rm -rf opus-1.3.1 && mkdir -p opus-1.3.1
          cp -r "$SRC"/celt "$SRC"/silk "$SRC"/src "$SRC"/include opus-1.3.1/
          echo "== opus 就位："; ls opus-1.3.1/
          test -f opus-1.3.1/src/opus.c

      - name: Install NDK and CMake
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID SDK = $SDK"
          # runner 上 cmdline-tools 的版本目录名会变（latest / 16.0 ...），用 find 定位
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then echo "!! 找不到 sdkmanager"; ls -la "$SDK" || true; exit 1; fi
          echo "sdkmanager = $SM"
          chmod +x "$SM" 2>/dev/null || true
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "ndk;25.1.8937393" "cmake;3.22.1" 2>&1 | tail -15
          echo "== 已装 NDK:"; ls "$SDK/ndk" || true
          echo "== 已装 CMake:"; ls "$SDK/cmake" || true
          test -d "$SDK/ndk/25.1.8937393"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 打 tag 时把 APK 连同版本号一起发布到 Releases，
      # 客户端检查更新读的就是 /releases/latest 的 tag_name 和 browser_download_url。
      - name: Publish Release
        if: steps.ver.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            小度 1C 语音助手 APK（versionCode ${{ steps.ver.outputs.version_code }}）
            签名与 debug 构建一致，可直接覆盖安装。
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
